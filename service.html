<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service - AutoCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Vehicle Service Booking Form</h2>
        
        <div id="error-box"></div> <!-- Displays validation messages -->

        <form action="process_service.php" method="POST" id="serviceForm">
            <!-- Customer Details -->
            <h3>Customer Information</h3>
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="form-group">
                <label>Phone Number (10 digits):</label>
                <input type="text" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="email" name="email">
            </div>

            <!-- Vehicle Details -->
            <h3>Vehicle Information</h3>
            <div class="form-group">
                <label>Vehicle Registration Number:</label>
                <input type="text" id="reg_no" name="reg_no">
            </div>
            <div class="form-group">
                <label>Vehicle Type:</label>
                <select id="type" name="type">
                    <option value="">-- Select Type --</option>
                    <option value="Saloon Car">Saloon Car</option>
                    <option value="SUV">SUV</option>
                    <option value="Pickup">Pickup</option>
                    <option value="Van">Van</option>
                </select>
            </div>
            <div class="form-group">
                <label>Vehicle Model:</label>
                <input type="text" id="model" name="model">
            </div>
            <div class="form-group">
                <label>Year of Manufacture:</label>
                <input type="number" id="year" name="year">
                <div id="age-warning">⚠️ Vehicle is older than 15 years. We highly recommend adding a Computer Diagnosis to your services.</div>
            </div>
            <div class="form-group">
                <label>Preferred Service Date:</label>
                <input type="date" id="date" name="date">
            </div>

            <!-- Services -->
            <h3>Required Services</h3>
            <div class="checkbox-group" id="services-group">
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Engine Oil Change" data-price="3000"> Engine Oil Change (KSh 3,000)</label>
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Brake Inspection" data-price="2000"> Brake Inspection (KSh 2,000)</label>
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Wheel Alignment" data-price="2500"> Wheel Alignment (KSh 2,500)</label>
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Computer Diagnosis" data-price="3500"> Computer Diagnosis (KSh 3,500)</label>
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Full Service" data-price="8000"> Full Service (KSh 8,000)</label>
                <label class="checkbox-item"><input type="checkbox" name="services[]" value="Vehicle Pickup and Delivery" data-price="1500"> Vehicle Pickup and Delivery (KSh 1,500)</label>
            </div>

            <!-- Dynamic UI Section -->
            <div id="dynamic-summary">
                <h4>Live Estimate</h4>
                <p><strong>Selected Services (<span id="service-count">0</span>):</strong></p>
                <ul id="selected-list">
                    <li>None selected</li>
                </ul>
                <h3>Estimated Total: KSh <span id="total-cost">0</span></h3>
            </div>

            <button type="submit" class="btn">Submit Service Request</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
